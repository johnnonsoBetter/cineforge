# CineForge on Fly.io — a single always-on machine with a persistent volume.
#
# This app CANNOT be horizontally scaled: it keeps a hot copy of every project in memory and
# writes canonical state to the volume at /data (see backend/pipeline/storage.py). One machine,
# one volume. `fly scale count 2` would split state across machines — don't.
#
# `app` must be globally unique on Fly. Change it, or run `fly launch --no-deploy` to have
# flyctl pick a name and rewrite this line.
app = "cineforge-studio"
primary_region = "iad"

[build]

[env]
  # Mock mode: no keys, no cost.
  MOCK_MODE = "true"
  DATA_DIR = "/data"

  # Frontend (Vite)
  VITE_SUPABASE_URL = "https://nrqyepfocwgbhxruwmkw.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycXllcGZvY3dnYmh4cnV3bWt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDE1ODAsImV4cCI6MjEwMDgxNzU4MH0.twySg23MXIN5IEwmboyGW0Ygiyl58A-f0fhb0vpDrrE"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[mounts]]
  source = "cineforge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
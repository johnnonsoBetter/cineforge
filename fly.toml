# CineForge on Fly.io — a single always-on machine with a persistent volume.
#
# This app CANNOT be horizontally scaled: it keeps a hot copy of every project in memory and
# writes canonical state to the volume at /data (see backend/pipeline/storage.py). One machine,
# one volume. `fly scale count 2` would split state across machines — don't.
#
# `app` must be globally unique on Fly. Change it, or run `fly launch --no-deploy` to have
# flyctl pick a name and rewrite this line.
app = "cineforge-studio"
primary_region = "iad"

[build]

[env]
  # Mock mode: no keys, no cost. Flip to real generation with:
  #   fly secrets set MOCK_MODE=false GMI_API_KEY=... B2_KEY_ID=... B2_APP_KEY=... B2_BUCKET=... B2_REGION=... OPENAI_API_KEY=...
  # (secrets override these env defaults; no redeploy of the image needed).
  MOCK_MODE = "true"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the one machine running: SSE streams are long-lived and the in-memory project cache
  # should stay warm. With the volume it also reloads state from disk on restart, so you can
  # switch this to "stop" later to save money — cold starts just re-read /data.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

# Persistent state. The volume must live in the same region as the machine (primary_region).
[[mounts]]
  source = "cineforge_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
